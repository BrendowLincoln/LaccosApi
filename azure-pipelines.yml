# Pipeline de CI do Laçoos.
# Etapa 1 da trilha: a cada push ou pull request na main, compila e roda todos os testes.
# As etapas de imagem e deploy entram depois, como novos stages neste mesmo arquivo.

# Quando rodar: push na main e pull requests que apontam para a main.
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/*
      - README.md

pr:
  branches:
    include:
      - main

# Máquina descartável da Microsoft. O Ubuntu já vem com Docker, que os testes de integração usam.
pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Pasta dos pacotes NuGet, guardada em cache entre execuções.
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
  BuildConfiguration: Release

stages:
  - stage: CI
    displayName: Build e testes
    jobs:
      - job: Test
        displayName: Compilar e testar
        timeoutInMinutes: 20
        steps:
          - task: UseDotNet@2
            displayName: Instalar o SDK definido no global.json
            inputs:
              useGlobalJson: true

          - task: Cache@2
            displayName: Cache dos pacotes NuGet
            inputs:
              key: 'nuget | "$(Agent.OS)" | Directory.Packages.props'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(NUGET_PACKAGES)

          - script: dotnet restore LacoosApi.sln
            displayName: Restaurar pacotes

          - script: dotnet build LacoosApi.sln -c $(BuildConfiguration) --no-restore
            displayName: Compilar

          # Unidade, arquitetura e integração (PostgreSQL real via Testcontainers).
          - script: >
              dotnet test --solution LacoosApi.sln
              -c $(BuildConfiguration) --no-build
              --report-xunit-trx
              --results-directory $(Agent.TempDirectory)/TestResults
            displayName: Rodar os testes

          # Mostra os resultados na aba Tests da execução, inclusive quando algum teste falha.
          - task: PublishTestResults@2
            displayName: Publicar resultados dos testes
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(Agent.TempDirectory)/TestResults
              testRunTitle: Laçoos

  # Etapa 2: empacota a API em uma imagem Docker e publica no GitHub Container Registry.
  # Só roda depois que os testes passam, e só para a main (pull requests não geram imagem).
  - stage: Image
    displayName: Imagem Docker
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildPush
        displayName: Gerar e publicar a imagem
        variables:
          # O Dockerfile usa cache de montagem (RUN --mount), que exige o BuildKit.
          DOCKER_BUILDKIT: '1'
        steps:
          - task: Docker@2
            displayName: Gerar e publicar no GHCR
            inputs:
              command: buildAndPush
              # Service connection do tipo Docker Registry apontando para https://ghcr.io.
              containerRegistry: ghcr-lacoos
              # Vira ghcr.io/brendowlincoln/lacoos-api (o GHCR exige letras minúsculas).
              repository: brendowlincoln/lacoos-api
              Dockerfile: Dockerfile
              buildContext: .
              # A tag com o hash do commit é a que o deploy vai usar: ela identifica
              # exatamente qual código está no ar. A "latest" é só uma conveniência.
              tags: |
                $(Build.SourceVersion)
                latest

  # Etapa 4: coloca no ar a imagem que acabou de ser publicada.
  # Primeiro aplica as migrations no banco, depois troca a imagem do Container App.
  - stage: Deploy
    displayName: Deploy em produção
    dependsOn: Image
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      # Variable group (Pipelines > Library) com o segredo DbConnection.
      - group: lacoos-prod
      - name: Image
        value: ghcr.io/brendowlincoln/lacoos-api:$(Build.SourceVersion)
      - name: ResourceGroup
        value: rg-lacoos
      - name: ContainerApp
        value: lacoos-api
    jobs:
      # Um "deployment job" fica registrado no environment: dá histórico do que foi
      # para produção e permite exigir aprovação manual antes de rodar.
      - deployment: DeployApi
        displayName: Migrations e deploy
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                # Roda a mesma imagem com o argumento "migrate": aplica as migrations e encerra.
                # Variáveis secretas não chegam aos scripts sozinhas: precisam ser mapeadas em "env".
                # O "-e" sem valor copia a variável do agente, então a senha não aparece no comando.
                - script: >
                    docker run --rm
                    -e ConnectionStrings__Postgres
                    $(Image) migrate
                  displayName: Aplicar migrations
                  env:
                    ConnectionStrings__Postgres: $(DbConnection)

                - task: AzureCLI@2
                  displayName: Atualizar a imagem do Container App
                  inputs:
                    # Service connection do tipo Azure Resource Manager, limitada ao rg-lacoos.
                    azureSubscription: azure-lacoos
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name $(ContainerApp) \
                        --resource-group $(ResourceGroup) \
                        --image $(Image) \
                        --output none

                      FQDN=$(az containerapp show --name $(ContainerApp) --resource-group $(ResourceGroup) \
                        --query properties.configuration.ingress.fqdn --output tsv)
                      echo "##vso[task.setvariable variable=ApiUrl]https://$FQDN"

                # Teste de fumaça: o deploy só é considerado bom se a API responder.
                # Tenta por até 2 minutos, porque o app pode estar saindo do zero.
                - script: |
                    for attempt in $(seq 1 12); do
                      if curl --silent --fail --max-time 10 "$(ApiUrl)/health"; then
                        echo
                        echo "API respondendo em $(ApiUrl)"
                        exit 0
                      fi
                      echo "Tentativa $attempt falhou, aguardando..."
                      sleep 10
                    done
                    echo "##vso[task.logissue type=error]A API não respondeu em $(ApiUrl)/health"
                    exit 1
                  displayName: Verificar a API no ar
